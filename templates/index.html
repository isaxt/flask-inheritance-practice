<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Meet the dogs</title></head>
<body>
{% extends "base.html" %}
{% block title %}<h1>Meet the dogs</h1>{% endblock %}
{% block content %}

<p>Two fictional dogs for our design experiment.</p>
<div class="dogs">
  {% for dog in dogs %}
  <section class="card">
    <span class="dog-icon" aria-hidden="true">🐶</span>
    <h2>{{ dog["name"] }}</h2>
    <p>{{ dog["description"] }}</p>
  </section>
  {% endfor %}
</div>
{% endblock %}
</div>
</body>
</html>
